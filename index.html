<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Система поручений</title>
    <style>
      /* Экран загрузки до старта приложения (12.F4): на медленной сети вместо
         белого экрана сразу видно, что система открывается. React заменяет его. */
      .boot {
        display: flex;
        height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font: 14px Inter, system-ui, sans-serif;
        color: #6b7280;
      }
      .boot-spinner {
        width: 22px;
        height: 22px;
        border: 2px solid #e5e7eb;
        border-top-color: #3f76ff;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <div class="boot-spinner"></div>
        <div>Система поручений</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
